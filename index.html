<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXLBLUES.COM</title>
  <style>
    body { background:#000; color:#fff; font-family:system-ui; margin:0; }

    header {
      background:#111; padding:18px 24px;
      display:flex; justify-content:space-between; align-items:center;
    }
    header h1 { font-size:2.4rem; font-weight:900; color:#1e90ff; }

    nav ul { list-style:none; display:flex; gap:16px; }
    nav ul li { position:relative; }
    nav a, nav button {
      background:none; border:none; cursor:pointer;
      font:inherit; color:#fff; font-size:1.2rem;
      padding:6px 8px; white-space:nowrap;
    }
    nav a:hover, nav button:hover { color:#1e90ff; }

    nav ul li ul {
      display:none; position:absolute; top:100%; left:0;
      background:#222; padding:8px 0; min-width:200px; border-radius:4px;
    }
    nav ul li ul li a { display:block; padding:8px 12px; }

    /* show on hover (desktop) */
    nav ul li:hover > ul { display:block; }

    /* utility class for JS toggle */
    .open > ul { display:block; }

    img, video { max-width:100%; height:auto; display:block; margin:20px auto; }

    .link-images { text-align:center; margin:30px auto; white-space:nowrap; }
    .link-images img { height:120px; width:auto; margin:10px; vertical-align:middle; }
  </style>
</head>
<body>
  <header>
    <h1>Axl Blues</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li>
          <button id="about-trigger">About ▾</button>
          <ul>
            <li><a href="short-bio.html">Short Bio</a></li>
            <li><a href="long-bio.html">Long Bio</a></li>
            <li><a href="timeline.html">Timeline</a></li>
            <li><a href="gallery.html">Gallery</a></li>
          </ul>
        </li>
        <li><a href="music.html">Music</a></li>
        <li><a href="store.html">Store</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <img src="AxlBluesTitle.jpg" alt="Axl Blues Title">
    <video controls>
      <source src="title.mp4" type="video/mp4">
    </video>
    <div class="link-images">
      <a href="https://thebluestruckers.com"><img src="https://thebluestruckers.com/black-truck.png" alt="Blues Truckers"></a>
      <a href="https://stardrivepaintings.com"><img src="http://stardrivepaintings.com/FullStardriveLogo.png" alt="Stardrive Paintings"></a>
      <a href="https://www.facebook.com/Drewdrive72" target="_blank"><img src="fbincon.png" alt="Facebook Icon"></a>
    </div>
  </main>

  <script>
    const trigger = document.getElementById('about-trigger');
    const parentLi = trigger.parentElement;
    trigger.addEventListener('click', function(e) {
      e.preventDefault();
      parentLi.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (!parentLi.contains(e.target)) parentLi.classList.remove('open');
    });
  </script>
</body>
</html>
