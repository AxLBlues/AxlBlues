<head>
  <meta charset="UTF-8" />

  <style>
    body { margin:0; background:#000; color:#fff; font-family:system-ui; }

    header {
      background:#111;
      padding:18px 24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }
    header h1 {
      margin:0;
      font-size:2.4rem;
      font-weight:900;
      color:#1e90ff;
      text-align:center;
    }

    nav ul {
      list-style:none;
      margin:0; padding:0;
      display:flex;
      flex-direction:row;
      flex-wrap:nowrap;        /* keep on one line */
      gap:16px;
      justify-content:center;
      align-items:center;
      white-space:nowrap;
    }
    nav ul li { position:relative; }
    nav a, nav summary {
      color:#fff;
      font-size:1.2rem;
      padding:6px 8px;
      text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
    }
    nav a:hover, nav summary:hover { color:#1e90ff; }

    nav details { position:relative; display:inline-block; }
    nav summary::-webkit-details-marker { display:none; }

    nav details ul {
      position:absolute;
      top:100%; left:0;
      background:#222;
      padding:8px 0;
      min-width:200px;
      border-radius:4px;
      display:none;
    }
    nav details[open] ul { display:block; }
    nav details ul li a {
      display:block;
      padding:8px 12px;
      font-size:1.1rem;
      color:#fff;
    }
    nav details ul li a:hover { background:#2b2b2b; }

    img, video { max-width:100%; height:auto; display:block; margin:20px auto; }

    .bio-short {
      max-width:800px;
      margin:40px auto;
      padding:24px;
      line-height:1.8;
    }
    .bio-short h2 {
      margin:0 0 20px;
      font-size:2.6rem;
      font-weight:900;
      color:#1e90ff;
      text-align:center;
    }
    .bio-short .sub {
      margin:0 0 22px;
      font-size:1.4rem;
      font-weight:600;
      color:#ccc;
      text-align:center;
    }
    .bio-short p { margin:0 0 18px; font-size:1.3rem; }

    .link-images {
      margin:30px auto;
      display:flex;
      flex-direction:row;
      flex-wrap:nowrap;
      justify-content:center;
      gap:16px;
    }
    .link-images img {
      height:120px;
      width:auto;
      display:block;
    }

    @media (max-width:600px) {
      header h1 { font-size:2rem; }
      nav a, nav summary { font-size:1rem; }
      .bio-short h2 { font-size:2.2rem; }
      .bio-short p { font-size:1.2rem; }
      .link-images img { height:90px; }
    }
  </style>
</head>

<section class="store-section">

  <p>All sizes from small to 3XL</p>

  <p>Regular Collar and V Necks</p>

  <!-- Slideshow container -->
  <div class="slideshow-container">

    <!-- Slides (replace src with your shirt images when ready) -->
    <div class="mySlides fade">
      <img src="shirt1.jpg" alt="Shirt 1">
    </div>

    <div class="mySlides fade">
      <img src="shirt2.jpg" alt="Shirt 2">
    </div>

    <div class="mySlides fade">
      <img src="shirt3.jpg" alt="Shirt 3">
    </div>

    <!-- Next/prev buttons -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
  </div>

  <!-- Dots for navigation -->
  <div style="text-align:center">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
  </div>
</section>

<style>
  .store-section {
    max-width:800px;
    margin:40px auto;
    padding:24px;
    text-align:center;
  }
  .store-section h2 {
    font-size:2.4rem;
    font-weight:900;
    color:#1e90ff;
    margin-bottom:20px;
  }
  .store-section p {
    font-size:1.3rem;
    color:#ccc;
    margin:8px 0;
  }

  /* Slideshow styles */
  .slideshow-container {
    position: relative;
    max-width: 600px;
    margin: 30px auto;
  }
  .mySlides {
    display: none;
  }
  .mySlides img {
    width: 100%;
    border-radius: 6px;
  }
  .prev, .next {
    cursor: pointer;
    position: absolute;
    top: 50%;
    width: auto;
    padding: 12px;
    margin-top: -22px;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    transition: 0.3s;
    border-radius: 0 3px 3px 0;
    user-select: none;
  }
  .next {
    right: 0;
    border-radius: 3px 0 0 3px;
  }
  .prev:hover, .next:hover {
    background-color: rgba(30,144,255,0.8);
  }
  .dot {
    cursor: pointer;
    height: 12px;
    width: 12px;
    margin: 0 4px;
    background-color: #bbb;
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.3s;
  }
  .active, .dot:hover {
    background-color: #1e90ff;
  }
</style>

<script>
  let slideIndex = 1;
  showSlides(slideIndex);

  function plusSlides(n) {
    showSlides(slideIndex += n);
  }

  function currentSlide(n) {
    showSlides(slideIndex = n);
  }

  function showSlides(n) {
    let i;
    let slides = document.getElementsByClassName("mySlides");
    let dots = document.getElementsByClassName("dot");
    if (n > slides.length) {slideIndex = 1}
    if (n < 1) {slideIndex = slides.length}
    for (i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";
    }
    for (i = 0; i < dots.length; i++) {
      dots[i].className = dots[i].className.replace(" active", "");
    }
    slides[slideIndex-1].style.display = "block";
    dots[slideIndex-1].className += " active";
  }
</script>
